<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Projeto em Equipe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-brand">
        <span class="brand-mark">PE</span>
        <div>
            <h1>Painel do Projeto</h1>
            <p>Acompanhamento de tarefas entre Pablo e Gabriela</p>
        </div>
    </div>
    <nav class="filtros" id="filtros">
        <button data-responsavel="Todos" class="ativo">Todos</button>
        <button data-responsavel="Pablo">Pablo</button>
        <button data-responsavel="Gabriela">Gabriela</button>
    </nav>
</header>

<main>
    <section class="resumo" id="resumo">
        <div class="cartao">
            <span class="cartao-numero" id="total-tarefas">0</span>
            <span class="cartao-rotulo">Tarefas no total</span>
        </div>
        <div class="cartao cartao-fazer">
            <span class="cartao-numero" id="total-a-fazer">0</span>
            <span class="cartao-rotulo">A fazer</span>
        </div>
        <div class="cartao cartao-andamento">
            <span class="cartao-numero" id="total-andamento">0</span>
            <span class="cartao-rotulo">Em andamento</span>
        </div>
        <div class="cartao cartao-concluido">
            <span class="cartao-numero" id="total-concluido">0</span>
            <span class="cartao-rotulo">Concluídas</span>
        </div>
    </section>

    <section class="conteudo">
        <div class="painel-form">
            <h2>Nova tarefa</h2>
            <form id="form-tarefa">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" required maxlength="150" placeholder="Ex.: Ajustar validação do formulário">

                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="3" placeholder="Detalhes da tarefa (opcional)"></textarea>

                <label for="responsavel">Responsável</label>
                <select id="responsavel" name="responsavel">
                    <option value="Pablo">Pablo</option>
                    <option value="Gabriela">Gabriela</option>
                </select>

                <label for="status">Status inicial</label>
                <select id="status" name="status">
                    <option value="A Fazer">A Fazer</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Concluído">Concluído</option>
                </select>

                <button type="submit">Adicionar tarefa</button>
            </form>
        </div>

        <div class="painel-lista">
            <h2 id="titulo-lista">Tarefas (Todos)</h2>
            <div id="lista-container">
                <p class="vazio">Carregando...</p>
            </div>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
